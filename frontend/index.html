<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Optimizacija prijevoza radnih strojeva – raspored naloga na kamione uz minimalnu kilometražu." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>UP Rent – optimizacija prijevoza</title>
    <script>
      // tema prije prvog iscrtavanja (bez bljeska)
      try {
        const t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
